name: Release Shadowrocket Rules

on:
  schedule:
    # 每日8时开始
    - cron:  '0 23 * * *'
  
  push:
    branches:
      - build
    tags:
      - '*'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      
  pull_request_target:
    branches:
      - build
    paths-ignore: 
      - '**.md'
      - 'LICENSE'

  workflow_dispatch:
  
jobs:
  Release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build
          path: build

      - uses: actions/checkout@v4
        with:
          ref: release
          path: release

      - name: Install requirements
        run: pip3 install -r build/requirements.txt

      - name: Build Rules
        run: |
          cd build || exit 1
          ./factory/auto_build.sh
      
      - name: Move files
        run: |
          cd build || exit 1
          # Preserve custom lazy_group.conf before overwriting with build output
          cp ../release/lazy_group.conf /tmp/lazy_group_custom.conf
          cp *.conf ../release/
          # Restore custom lazy_group.conf (contains maintained AI proxy rules)
          cp /tmp/lazy_group_custom.conf ../release/lazy_group.conf
          cp -r figure ../release/
          cp LICENSE ../release/
          cp readme.md ../release/

      - name: Update lazy rules
        run: |
          cd release || exit 1
          # Only update lazy.conf from upstream; lazy_group.conf is maintained in this repo
          rm lazy.conf
          curl -O https://raw.githubusercontent.com/LOWERTOP/Shadowrocket/main/lazy.conf
        
      - name: Remove commits
        run: |
          cd release || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan latest_branch
          git add -A
          git commit -am "Nightly build"
          git branch -D release
          git branch -m release
          git push -f origin release
